spring.application.name=WalletService

server.port=8080


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/wallet_db}
spring.datasource.username=${DB_USERNAME:wallet_user}
spring.datasource.password=${DB_PASSWORD:wallet_password}


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true